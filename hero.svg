<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">FastAPI: typed requests, validated, with automatic docs</title>
  <desc id="d">A POST request to create a user is validated field by field against a Pydantic schema — email, name and age all type-checked — then returns a 201 response. FastAPI generates interactive Swagger docs at /docs automatically.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#009688"/><stop offset=".5" stop-color="#05b8a6"/><stop offset="1" stop-color="#3ddc84"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes req { 0%,3.00% { opacity:0; transform:translateX(-8px); } 6.50%,94.00% { opacity:1; transform:translateX(0); } 97.00%,100% { opacity:0 } } .req { animation:req 10.0s infinite; }
    @keyframes v1 { 0%,22.00% { opacity:0; } 25.50%,94.00% { opacity:1; } 97.00%,100% { opacity:0 } } .v1 { animation:v1 10.0s infinite; }
    @keyframes v2 { 0%,26.00% { opacity:0; } 29.50%,94.00% { opacity:1; } 97.00%,100% { opacity:0 } } .v2 { animation:v2 10.0s infinite; }
    @keyframes v3 { 0%,30.00% { opacity:0; } 33.50%,94.00% { opacity:1; } 97.00%,100% { opacity:0 } } .v3 { animation:v3 10.0s infinite; }
    @keyframes resp { 0%,46.00% { opacity:0; transform:translateX(8px); } 49.50%,94.00% { opacity:1; transform:translateX(0); } 97.00%,100% { opacity:0 } } .resp { animation:resp 10.0s infinite; }
    @keyframes docs { 0%,64.00% { opacity:0; transform:translateY(8px); } 67.50%,94.00% { opacity:1; transform:translateY(0); } 97.00%,100% { opacity:0 } } .docs { animation:docs 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="400" rx="20" fill="#0f1420"/>
  <text x="40" y="58" font-size="40" font-weight="800" style="fill:url(#title)">FastAPI REST API</text>
  <text x="42" y="88" font-size="16" class="muted">Typed in, validated, typed out — and the docs write themselves.</text>

  <!-- request -->
  <g class="req"><rect x="40" y="130" width="250" height="150" rx="12" fill="#0b0f18" stroke="#2c3750"/>
    <text x="56" y="152" font-size="11" font-weight="700" class="mono" style="fill:#3ddc84">POST /users</text>
    <text x="56" y="178" font-size="12" class="mono muted">{</text>
    <text x="70" y="198" font-size="12" class="mono">"email": "sam@acme.io",</text>
    <text x="70" y="218" font-size="12" class="mono">"name": "Sam",</text>
    <text x="70" y="238" font-size="12" class="mono">"age": 34</text>
    <text x="56" y="258" font-size="12" class="mono muted">}</text></g>

  <!-- validation -->
  <rect x="330" y="150" width="200" height="110" rx="12" fill="#0a1a18" stroke="#05b8a6" stroke-width="2"/>
  <text x="430" y="174" text-anchor="middle" font-size="13" font-weight="800">Pydantic schema</text>
  <g class="v1"><text x="346" y="200" font-size="12" class="mono"><tspan style="fill:#3ddc84">✓</tspan> email: EmailStr</text></g>
  <g class="v2"><text x="346" y="222" font-size="12" class="mono"><tspan style="fill:#3ddc84">✓</tspan> name: str</text></g>
  <g class="v3"><text x="346" y="244" font-size="12" class="mono"><tspan style="fill:#3ddc84">✓</tspan> age: int</text></g>
  <path d="M290 205 L 330 205" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <path d="M530 205 L 570 205" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>

  <!-- response -->
  <g class="resp"><rect x="570" y="130" width="250" height="110" rx="12" fill="#0b0f18" stroke="#2c3750"/>
    <text x="586" y="152" font-size="11" font-weight="700" class="mono" style="fill:#3ddc84">201 Created</text>
    <text x="586" y="178" font-size="12" class="mono">"id": 1,</text>
    <text x="586" y="198" font-size="12" class="mono">"email": "sam@acme.io",</text>
    <text x="586" y="218" font-size="12" class="mono muted">"created_at": …</text></g>

  <!-- auto docs -->
  <g class="docs"><rect x="40" y="300" width="780" height="64" rx="12" fill="#161d2b" stroke="#009688" stroke-opacity=".6"/>
    <text x="60" y="326" font-size="13" font-weight="700">📖 Interactive docs, generated for you</text>
    <text x="60" y="348" font-size="12" class="mono muted">GET /docs → Swagger UI   ·   GET /redoc → ReDoc   ·   openapi.json</text>
    <rect x="690" y="318" width="110" height="28" rx="8" fill="#009688" fill-opacity=".15" stroke="#05b8a6"/><text x="745" y="337" text-anchor="middle" font-size="11" font-weight="700" style="fill:#5fe8d8">+ JWT auth</text></g>
</svg>
